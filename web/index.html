<!doctype html>
<html lang="zh-CN" data-theme="nanom">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GoMall · 登录与待办</title>
<style>
  body { margin: 0; background: #f5f6f8; color: #1f2328;
         font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: #111827; color: #fff; }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  header .who { font-size: 12px; color: #9ca3af; }
  header .spacer { flex: 1; }
  header button { background: transparent; color: #fff; border-color: #374151; }
  main { max-width: 860px; margin: 18px auto 40px; padding: 0 14px; display: grid; gap: 14px; }
  .card { background: #fff; border: 1px solid #e3e6ea; border-radius: 10px; padding: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input, button { font: inherit; }
  input { padding: 7px 9px; border: 1px solid #e3e6ea; border-radius: 6px; min-width: 0; }
  input:focus { outline: 2px solid #bfdbfe; border-color: #2563eb; }
  button { padding: 7px 14px; border: 1px solid transparent; border-radius: 6px;
           background: #2563eb; color: #fff; cursor: pointer; white-space: nowrap; }
  button.ghost { background: #fff; color: #1f2328; border-color: #e3e6ea; }
  button.danger { background: #fff; color: #b91c1c; border-color: #fecaca; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tabs button { background: #fff; color: #6b7280; border-color: #e3e6ea; }
  .tabs button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  .msg { margin-top: 10px; padding: 8px 10px; border-radius: 6px; font-size: 13px; white-space: pre-wrap; }
  .msg.ok { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
  .msg.err { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  .msg:empty { display: none; }
  table.kv { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
  table.kv td { padding: 5px 0; border-bottom: 1px dashed #e3e6ea; }
  table.kv td:first-child { width: 90px; color: #6b7280; }
  .todo { display: grid; gap: 6px; padding: 10px; margin-bottom: 8px;
          border: 1px solid #e3e6ea; border-radius: 8px; }
  .todo .head { display: flex; align-items: center; gap: 8px; }
  .todo .title { flex: 1; word-break: break-all; }
  .todo.done .title { text-decoration: line-through; color: #9ca3af; }
  .todo .id { color: #9ca3af; font-size: 12px; white-space: nowrap; }
  .todo .row input { flex: 1; }
  .hint { color: #6b7280; font-size: 12px; }
  [hidden] { display: none !important; }

  /* 页脚：两套主题共用的骨架 */
  footer { max-width: 860px; margin: 0 auto 40px; padding: 0 14px; text-align: center; color: #6b7280; font-size: 12px; }
  footer hr { border: none; border-bottom: 1px solid #e3e6ea; margin: 22px 0 8px; }

  /* ================= 主题 nanom（暗色）· 上面的亮色规则原样保留 ================= */
  html[data-theme="nanom"] {
    --nm-bg: #322f3e;
    --nm-card: #3a3750;
    --nm-input: #2b2839;
    --nm-line: #4a4660;
    --nm-rule: #875bbb;
    --nm-text: #b1b3cd;
    --nm-dim: #9fa1bd;
    --nm-pink: #ff77a8;
    --nm-pink-hot: #ff004d;
    --nm-teal: #5dafa3;
    --nm-red: #ff6b6b;
    --nm-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }

  html[data-theme="nanom"] body {
    background-color: var(--nm-bg);
    background-image: repeating-linear-gradient(180deg, rgba(255,255,255,.015) 0 1px, transparent 1px 26px);
    color: var(--nm-text);
    line-height: 1.8;
  }

  html[data-theme="nanom"] header {
    max-width: 760px; margin: 26px auto 0; padding: 0 14px 10px;
    background: transparent; border-bottom: 1px solid var(--nm-rule);
  }
  html[data-theme="nanom"] header h1 {
    font: 700 17px/1.4 var(--nm-mono); letter-spacing: .06em;
    color: var(--nm-text); text-shadow: 2px 2px #50537c;
  }
  html[data-theme="nanom"] header h1::before { content: '#! '; color: var(--nm-pink); }
  html[data-theme="nanom"] header .who { color: var(--nm-dim); font-family: var(--nm-mono); }
  html[data-theme="nanom"] header button { background: transparent; color: var(--nm-text); border-color: var(--nm-line); }

  html[data-theme="nanom"] main { max-width: 760px; margin-top: 20px; }

  html[data-theme="nanom"] .card {
    background: var(--nm-card); border: 1px solid var(--nm-line); border-radius: 2px;
  }
  html[data-theme="nanom"] .card h2 {
    font: 700 13px/1.4 var(--nm-mono); letter-spacing: .1em; color: var(--nm-text);
  }
  html[data-theme="nanom"] .card h2::before { content: '> '; color: var(--nm-pink-hot); }

  html[data-theme="nanom"] input {
    background: var(--nm-input); border: 1px solid var(--nm-line);
    border-radius: 2px; color: var(--nm-text);
  }
  html[data-theme="nanom"] input::placeholder { color: var(--nm-dim); }
  html[data-theme="nanom"] input:focus {
    outline: 1px solid var(--nm-pink); outline-offset: 0; border-color: var(--nm-pink);
  }
  html[data-theme="nanom"] input[type="checkbox"] {
    accent-color: var(--nm-pink); width: 15px; height: 15px;
  }

  html[data-theme="nanom"] button {
    background: transparent; color: var(--nm-text);
    border: 1px solid var(--nm-line); border-radius: 2px;
    font-family: var(--nm-mono); font-size: 12px; letter-spacing: .05em;
    transition: color .2s ease-in-out, border-color .2s ease-in-out;
  }
  html[data-theme="nanom"] button:hover { color: var(--nm-pink); border-color: var(--nm-pink); }
  html[data-theme="nanom"] button.ghost { background: transparent; color: var(--nm-dim); border-color: var(--nm-line); }
  html[data-theme="nanom"] button.danger { background: transparent; color: #ff5447; border-color: #6e3a3a; }
  html[data-theme="nanom"] button.danger:hover { color: var(--nm-pink-hot); border-color: #ff5447; }

  html[data-theme="nanom"] .tabs button {
    background: transparent; border-color: transparent; color: var(--nm-dim);
  }
  html[data-theme="nanom"] .tabs button.active {
    background: transparent; color: var(--nm-pink);
    border-color: transparent; border-bottom: 1px dotted var(--nm-pink);
  }

  html[data-theme="nanom"] .msg {
    background: none; border: none; border-radius: 0;
    border-left: 2px solid var(--nm-line); padding: 6px 10px; color: var(--nm-text);
  }
  html[data-theme="nanom"] .msg.ok {
    background: none; border: none; border-left: 2px solid var(--nm-teal); color: var(--nm-teal);
  }
  html[data-theme="nanom"] .msg.ok::before { content: '[ok] '; }
  html[data-theme="nanom"] .msg.err {
    background: none; border: none; border-left: 2px solid var(--nm-red); color: var(--nm-red);
  }
  html[data-theme="nanom"] .msg.err::before { content: '[!] '; }

  html[data-theme="nanom"] table.kv td { border-bottom: 1px dashed var(--nm-line); }
  html[data-theme="nanom"] table.kv td:first-child {
    color: var(--nm-dim); font-family: var(--nm-mono); font-size: 12px;
  }

  html[data-theme="nanom"] .todo {
    background: none; border: none; border-left: 2px solid var(--nm-line); border-radius: 0;
  }
  html[data-theme="nanom"] .todo .title { font-family: var(--nm-mono); }
  html[data-theme="nanom"] .todo .id { color: var(--nm-dim); font-family: var(--nm-mono); }
  html[data-theme="nanom"] .todo.done .title { text-decoration: line-through; color: var(--nm-dim); }
  html[data-theme="nanom"] .todo.done { border-left-color: var(--nm-rule); }

  html[data-theme="nanom"] .hint { color: var(--nm-dim); }
  html[data-theme="nanom"] a { color: var(--nm-pink); text-decoration: none; border-bottom: 1px dotted; }
  html[data-theme="nanom"] a:hover { color: var(--nm-pink-hot); }

  html[data-theme="nanom"] footer {
    max-width: 760px; color: var(--nm-dim);
    font-family: var(--nm-mono); font-size: 11px;
  }
  html[data-theme="nanom"] footer hr { border-bottom: 1px solid var(--nm-rule); }
</style>
</head>
<body>

<header>
  <h1>GoMall · 登录与待办</h1>
  <span class="who" id="who">未登录</span>
  <div class="spacer"></div>
  <button class="ghost" id="btn-theme" title="切换主题">切到亮色</button>
  <button class="ghost" id="btn-logout" hidden>退出登录</button>
</header>

<main>
  <div class="msg" id="net-msg"></div>

  <!-- 登录 / 注册 -->
  <section class="card" id="auth-card">
    <div class="tabs">
      <button data-tab="login" class="active">登录</button>
      <button data-tab="register">注册</button>
    </div>
    <div id="pane-login">
      <div class="row">
        <input id="li-user" placeholder="用户名" autocomplete="username" />
        <input id="li-pass" type="password" placeholder="密码" autocomplete="current-password" />
        <button id="btn-login">登录</button>
      </div>
    </div>
    <div id="pane-register" hidden>
      <div class="row">
        <input id="rg-user" placeholder="用户名" autocomplete="username" />
        <input id="rg-pass" type="password" placeholder="密码（至少 6 位）" autocomplete="new-password" />
        <input id="rg-pass2" type="password" placeholder="确认密码" autocomplete="new-password" />
        <button id="btn-register">注册</button>
      </div>
    </div>
    <div class="msg" id="auth-msg"></div>
  </section>

  <!-- 我的信息 -->
  <section class="card" id="info-card" hidden>
    <h2>我的信息</h2>
    <table class="kv">
      <tr><td>ID</td><td id="u-id">-</td></tr>
      <tr><td>用户名</td><td id="u-name">-</td></tr>
      <tr><td>注册时间</td><td id="u-created">-</td></tr>
    </table>
    <div class="row">
      <input id="u-new-name" placeholder="新用户名" />
      <input id="u-new-pass" type="password" placeholder="密码（必填，至少 6 位）" autocomplete="new-password" />
      <button id="btn-save-info">保存</button>
    </div>
    <div class="hint">这个接口会同时更新用户名和密码，两栏都必填；改名后仍保持登录，无需重新登录。</div>
    <div class="msg" id="info-msg"></div>
  </section>

  <!-- 修改密码 -->
  <section class="card" id="pwd-card" hidden>
    <h2>修改密码</h2>
    <div class="row">
      <input id="pwd-new" type="password" placeholder="新密码" autocomplete="new-password" />
      <input id="pwd-new2" type="password" placeholder="确认新密码" autocomplete="new-password" />
      <button id="btn-change-pwd">修改</button>
    </div>
    <div class="msg" id="pwd-msg"></div>
  </section>

  <!-- 待办列表 -->
  <section class="card" id="todo-card">
    <h2>待办列表</h2>
    <div class="row" id="todo-lock">
      <span class="hint">登录后才能查看和操作待办</span>
    </div>
    <div class="row" id="todo-tools" hidden>
      <input id="todo-title" placeholder="标题" />
      <input id="todo-content" placeholder="内容（可选）" />
      <button id="btn-create-todo">添加</button>
    </div>
    <div class="msg" id="todo-msg"></div>
    <div id="todo-list"></div>
  </section>
</main>

<footer>
  <hr>
  <small>GoMall · 第一轮 · Gin + GORM + MySQL</small>
</footer>

<script>
(function () {
  'use strict';

  var KEY = 'gomall_token';
  var token = localStorage.getItem(KEY) || '';
  var me = null;

  function $(s) { return document.querySelector(s); }

  // ---------- 主题切换：nanom（暗色） / light（原亮色） ----------
  var THEME_KEY = 'gomall_theme';

  function applyTheme(name) {
    var root = document.documentElement;
    if (name === 'nanom') {
      root.setAttribute('data-theme', 'nanom');
      $('#btn-theme').textContent = '切到亮色';
    } else {
      root.removeAttribute('data-theme');
      $('#btn-theme').textContent = '切到暗色';
    }
    localStorage.setItem(THEME_KEY, name);
  }

  function toggleTheme() {
    var cur = document.documentElement.getAttribute('data-theme') === 'nanom' ? 'nanom' : 'light';
    applyTheme(cur === 'nanom' ? 'light' : 'nanom');
  }

  function msg(sel, ok, text) {
    var el = $(sel);
    el.className = 'msg ' + (ok ? 'ok' : 'err');
    el.textContent = text;
  }

  function clearMsg(sel) {
    var el = $(sel);
    el.className = 'msg';
    el.textContent = '';
  }

  // 401 已经由 request() 统一提示并退回登录页，调用方不再重复弹错
  function fail(sel, e) {
    if (!e.unauthorized) msg(sel, false, e.message);
  }

  function fmt(v) {
    if (!v) return '-';
    var d = new Date(v);
    return isNaN(d.getTime()) ? String(v) : d.toLocaleString();
  }

  // 统一请求：自动带 Authorization，401 自动回登录页，非 2xx 抛出后端错误文案
  function request(method, path, body, opts) {
    var headers = {};
    if (body !== undefined) headers['Content-Type'] = 'application/json';
    if (token) headers['Authorization'] = token.indexOf('Bearer ') === 0 ? token : 'Bearer ' + token;

    return fetch(path, {
      method: method,
      headers: headers,
      body: body === undefined ? undefined : JSON.stringify(body)
    }).catch(function () {
      msg('#net-msg', false, '无法连接后端，请确认服务已启动');
      throw new Error('网络错误');
    }).then(function (res) {
      clearMsg('#net-msg');
      return res.text().then(function (text) {
        var data = null;
        if (text) { try { data = JSON.parse(text); } catch (e) { data = text; } }

        // 登录接口的 401 是"密码错"，不是"登录失效"，由调用方自己提示
        if (res.status === 401 && !(opts && opts.skipAuthRedirect)) {
          logout();
          msg('#auth-msg', false, '登录已失效，请重新登录');
          var err = new Error('未登录');
          err.unauthorized = true;
          throw err;
        }
        if (!res.ok) {
          var m = (data && (data.error || data.msg || data.message)) || ('HTTP ' + res.status);
          throw new Error(m);
        }
        return data;
      });
    });
  }

  // ---------- 视图切换 ----------

  function render() {
    var logged = !!token;
    $('#auth-card').hidden = logged;
    $('#info-card').hidden = !logged;
    $('#pwd-card').hidden = !logged;
    $('#btn-logout').hidden = !logged;
    $('#todo-tools').hidden = !logged;
    $('#todo-lock').hidden = logged;
    $('#who').textContent = logged ? ('已登录：' + (me ? me.username : '')) : '未登录';
    if (!logged) $('#todo-list').innerHTML = '';
  }

  function logout(text) {
    token = '';
    me = null;
    localStorage.removeItem(KEY);
    ['#li-pass', '#u-new-name', '#u-new-pass', '#pwd-new', '#pwd-new2',
     '#todo-title', '#todo-content'].forEach(function (s) {
      var el = $(s);
      if (el) el.value = '';
    });
    clearMsg('#info-msg');
    clearMsg('#pwd-msg');
    clearMsg('#todo-msg');
    render();
    if (text) msg('#auth-msg', true, text);
  }

  function onLoggedIn() {
    render();
    loadProfile();
    loadTodos();
  }

  // ---------- 注册 / 登录 / 退出 ----------

  function switchTab(name) {
    var isLogin = name === 'login';
    $('#pane-login').hidden = !isLogin;
    $('#pane-register').hidden = isLogin;
    var tabs = document.querySelectorAll('.tabs button');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].className = tabs[i].getAttribute('data-tab') === name ? 'active' : '';
    }
  }

  function register() {
    clearMsg('#auth-msg');
    var username = $('#rg-user').value.trim();
    var p1 = $('#rg-pass').value;
    var p2 = $('#rg-pass2').value;

    if (!username) return msg('#auth-msg', false, '请填写用户名');
    if (p1.length < 6) return msg('#auth-msg', false, '密码至少 6 位');
    if (p1 !== p2) return msg('#auth-msg', false, '两次输入的密码不一致');

    request('POST', '/api/users', { username: username, password: p1 })
      .then(function () {
        $('#rg-user').value = $('#rg-pass').value = $('#rg-pass2').value = '';
        switchTab('login');
        $('#li-user').value = username;
        msg('#auth-msg', true, '注册成功，请登录');
      })
      .catch(function (e) { msg('#auth-msg', false, e.message); });
  }

  function login() {
    clearMsg('#auth-msg');
    var username = $('#li-user').value.trim();
    var password = $('#li-pass').value;
    if (!username || !password) return msg('#auth-msg', false, '请填写用户名和密码');

    request('POST', '/api/users/login', { username: username, password: password }, { skipAuthRedirect: true })
      .then(function (data) {
        token = (data && (data.token || data.Token)) || '';
        if (!token) throw new Error('登录成功但响应里没有 token');
        localStorage.setItem(KEY, token);
        $('#li-pass').value = '';
        onLoggedIn();
        msg('#auth-msg', true, '登录成功');
      })
      .catch(function (e) { msg('#auth-msg', false, e.message); });
  }

  function doLogout() {
    // 后端没有 logout 接口，JWT 无状态，本地清除即可
    logout();
    msg('#auth-msg', true, '已退出登录');
  }

  // ---------- 我的信息 ----------

  function loadProfile() {
    request('GET', '/api/users')
      .then(function (data) {
        me = (data && data.user) || {};
        $('#u-id').textContent = me.id === undefined ? '-' : me.id;
        $('#u-name').textContent = me.username || '-';
        $('#u-created').textContent = fmt(me.created_at);
        $('#who').textContent = '已登录：' + (me.username || '');
      })
      .catch(function (e) { fail('#info-msg', e); });
  }

  function saveInfo() {
    clearMsg('#info-msg');
    var name = $('#u-new-name').value.trim();
    var pwd = $('#u-new-pass').value;

    if (!name) return msg('#info-msg', false, '请填写新用户名');
    if (pwd.length < 6) return msg('#info-msg', false, '密码至少 6 位');

    request('PATCH', '/api/users', { username: name, password: pwd })
      .then(function () {
        $('#u-new-name').value = '';
        $('#u-new-pass').value = '';
        msg('#info-msg', true, '保存成功');
        loadProfile();   // 顶栏用户名同步刷新；token 里存的是 userID，改名不会掉线
      })
      .catch(function (e) { fail('#info-msg', e); });
  }

  // ---------- 修改密码 ----------

  function changePassword() {
    clearMsg('#pwd-msg');
    var p1 = $('#pwd-new').value;
    var p2 = $('#pwd-new2').value;

    if (p1.length < 6) return msg('#pwd-msg', false, '新密码至少 6 位');
    if (p1 !== p2) return msg('#pwd-msg', false, '两次输入的密码不一致');
    if (!me || !me.username) return msg('#pwd-msg', false, '还没取到用户名，请刷新页面');

    request('PATCH', '/api/users', { username: me.username, password: p1 })
      .then(function () {
        $('#pwd-new').value = '';
        $('#pwd-new2').value = '';
        msg('#pwd-msg', true, '密码已修改');
      })
      .catch(function (e) { fail('#pwd-msg', e); });
  }

  // ---------- 待办 ----------

  function loadTodos() {
    request('GET', '/api/todos')
      .then(function (data) { renderTodos((data && data.todos) || []); })
      .catch(function (e) {
        $('#todo-list').innerHTML = '';
        fail('#todo-msg', e);
      });
  }

  function renderTodos(list) {
    var box = $('#todo-list');
    box.innerHTML = '';

    if (!list.length) {
      var empty = document.createElement('div');
      empty.className = 'hint';
      empty.textContent = '暂无待办';
      box.appendChild(empty);
      return;
    }

    list.forEach(function (t) {
      var done = !!t.Completed;

      var item = document.createElement('div');
      item.className = 'todo' + (done ? ' done' : '');

      var head = document.createElement('div');
      head.className = 'head';

      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = done;
      cb.title = '标记完成 / 取消完成';
      // 后端 update 是整体覆盖，没改的字段要带上原值
      cb.onchange = function () {
        patchTodo(t, { title: t.Title || '', content: t.Content || '', completed: cb.checked });
      };

      var title = document.createElement('span');
      title.className = 'title';
      title.textContent = t.Title || '(无标题)';

      var id = document.createElement('span');
      id.className = 'id';
      id.textContent = '#' + t.ID + ' · ' + fmt(t.CreatedAt);

      var del = document.createElement('button');
      del.className = 'danger';
      del.textContent = '删除';
      del.onclick = function () { removeTodo(t); };

      head.appendChild(cb);
      head.appendChild(title);
      head.appendChild(id);
      head.appendChild(del);

      var content = document.createElement('input');
      content.value = t.Content || '';
      content.placeholder = '内容';

      var save = document.createElement('button');
      save.className = 'ghost';
      save.textContent = '保存内容';
      save.onclick = function () {
        patchTodo(t, { title: t.Title || '', content: content.value, completed: cb.checked });
      };

      var row = document.createElement('div');
      row.className = 'row';
      row.appendChild(content);
      row.appendChild(save);

      item.appendChild(head);
      item.appendChild(row);
      box.appendChild(item);
    });
  }

  function patchTodo(t, changes) {
    request('PATCH', '/api/todos/' + t.ID, changes)
      .then(function () {
        msg('#todo-msg', true, '已更新 #' + t.ID);
        loadTodos();
      })
      .catch(function (e) {
        fail('#todo-msg', e);
        loadTodos(); // 失败时以服务端数据为准
      });
  }

  function removeTodo(t) {
    if (!window.confirm('确定删除 #' + t.ID + ' 吗？')) return;
    request('DELETE', '/api/todos/' + t.ID)
      .then(function () {
        msg('#todo-msg', true, '已删除 #' + t.ID);
        loadTodos();
      })
      .catch(function (e) { fail('#todo-msg', e); });
  }

  function createTodo() {
    clearMsg('#todo-msg');
    var title = $('#todo-title').value.trim();
    var content = $('#todo-content').value;

    if (!title) return msg('#todo-msg', false, '请填写标题');

    request('POST', '/api/todos', { title: title, content: content })
      .then(function () {
        $('#todo-title').value = '';
        $('#todo-content').value = '';
        msg('#todo-msg', true, '添加成功');
        loadTodos();
      })
      .catch(function (e) { fail('#todo-msg', e); });
  }

  // ---------- 事件绑定 ----------

  var tabs = document.querySelectorAll('.tabs button');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].addEventListener('click', function () {
      switchTab(this.getAttribute('data-tab'));
      clearMsg('#auth-msg');
    });
  }

  $('#btn-register').addEventListener('click', register);
  $('#btn-login').addEventListener('click', login);
  $('#btn-logout').addEventListener('click', doLogout);
  $('#btn-save-info').addEventListener('click', saveInfo);
  $('#btn-change-pwd').addEventListener('click', changePassword);
  $('#btn-create-todo').addEventListener('click', createTodo);
  $('#btn-theme').addEventListener('click', toggleTheme);

  [['#li-user', login], ['#li-pass', login],
   ['#rg-user', register], ['#rg-pass', register], ['#rg-pass2', register],
   ['#u-new-name', saveInfo], ['#u-new-pass', saveInfo],
   ['#pwd-new', changePassword], ['#pwd-new2', changePassword],
   ['#todo-title', createTodo], ['#todo-content', createTodo]].forEach(function (pair) {
    $(pair[0]).addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); pair[1](); }
    });
  });

  // 另一个标签页登录/退出时，本页跟着同步
  window.addEventListener('storage', function (e) {
    if (e.key !== KEY) return;
    token = localStorage.getItem(KEY) || '';
    if (!token) {
      logout('已在其他标签页退出登录');
      return;
    }
    onLoggedIn();
  });

  // 浏览器前进/后退从 bfcache 恢复时，重新同步 token 与服务端数据
  window.addEventListener('pageshow', function (e) {
    if (!e.persisted) return;
    token = localStorage.getItem(KEY) || '';
    if (!token) { logout(); return; }
    render();
    loadProfile();
    loadTodos();
  });

  // 首屏：先定主题，再看是否有 token
  applyTheme(localStorage.getItem(THEME_KEY) || 'nanom');
  render();
  if (token) onLoggedIn();
})();
</script>
</body>
</html>
